<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andy Rodrez | Conecta conmigo</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* Paleta base de andyrodrez.com */
            --bg-dark: #0f172a;
            --text-white: #f8fafc;
            
            /* Colores de marca con opacidad para fondos */
            --color-web: #3b82f6;
            --color-whatsapp: #22c55e;
            --color-instagram: #f43f5e;
            
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile {
            margin-bottom: 35px;
        }

        /* Modificado para alojar un logo en lugar de una foto de perfil */
        .logo-img {
            width: 120px;
            height: 120px;
            object-fit: cover; /* Asegura que la imagen cubra todo el círculo */
            margin-bottom: 20px;
            border-radius: 50%; /* Hace el logo perfectamente circular */
            
            /* Borde con gradiente para destacar el logo circular */
            border: 3px solid transparent;
            background: linear-gradient(var(--bg-dark), var(--bg-dark)) padding-box,
                        linear-gradient(135deg, var(--color-web), #8b5cf6) border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p.bio {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.5;
            text-align: center;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 18px 22px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-white);
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
        }

        /* Botón Descarga: Énfasis Principal */
        .btn-download {
            border-color: rgba(59, 130, 246, 0.5); /* Azul intenso */
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.15), rgba(139, 92, 246, 0.15)); /* Gradiente azul a morado */
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.1);
        }
        .btn-download i:first-child { color: var(--color-web); filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.5)); }

        /* Botón Video: Acción Secundaria */
        .btn-video {
            border-color: rgba(244, 63, 94, 0.4); /* Rojo rosado estilo Youtube/Play */
            background: linear-gradient(90deg, rgba(244, 63, 94, 0.1), transparent);
        }
        .btn-video i:first-child { color: var(--color-instagram); filter: drop-shadow(0 0 5px rgba(244, 63, 94, 0.5)); }

        .link-text {
            flex-grow: 1;
            text-align: center;
            font-weight: 600;
            font-size: 1.05rem;
        }

        /* Hover dinámico mejorado */
        .link-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.07);
        }

        .btn-download:hover { border-color: var(--color-web); box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        .btn-video:hover { border-color: var(--color-instagram); box-shadow: 0 0 20px rgba(244, 63, 94, 0.2); }

        .chevron {
            opacity: 0.4;
            width: 18px;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #475569;
            font-weight: 500;
            line-height: 1.4;
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- Perfil / Logo -->
        <div class="profile">
            <!-- 
                REEMPLAZA el 'src' con la ruta de tu logo, por ejemplo:
                src="img/mi-logo.png" o src="logo.svg" 
            -->
            <img 
                src="URL_DE_TU_LOGO_AQUI" 
                alt="Logo Andy Rodrez" 
                class="logo-img" 
                onerror="this.src='https://placehold.co/400x200/1e293b/f8fafc?text=Logo+Aqui'"
            >
            <h1>Andy Rodrez</h1>
            <p class="bio">Ayudo a emprendedores neurodivergentes a hackear su código fuente y salir del caos.</p>
        </div>

        <!-- Enlaces -->
        <div class="links-container">
            
            <!-- Descarga Documento -->
            <a href="#" target="_blank" class="link-card btn-download">
                <i data-lucide="download"></i>
                <span class="link-text">Descargar The System Reset</span>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

            <!-- Ver Video -->
            <a href="#" target="_blank" class="link-card btn-video">
                <i data-lucide="play-circle"></i>
                <span class="link-text">Ver Video Explicativo</span>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

        </div>

        <div class="footer">
            <p>© 2026 Andy Rodrez. Hecho para mentes diferentes.</p>
        </div>
    </div>

    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();
    </script>
</body>
</html>
