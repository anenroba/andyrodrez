<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andy Rodrez | Conecta conmigo</title>
    
    <!-- Lucide Icons para los iconos de los botones -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            /* Paleta base */
            --bg-dark: #0f172a;
            --text-white: #f8fafc;
            
            /* Colores de marca para los botones */
            --color-web: #3b82f6;
            --color-download: #8b5cf6; /* Morado para descarga */
            --color-video: #f43f5e;    /* Rojo/Rosado para video */
            
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile {
            margin-bottom: 35px;
        }

        .logo-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            margin-bottom: 20px;
            border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(var(--bg-dark), var(--bg-dark)) padding-box,
                        linear-gradient(135deg, var(--color-web), #8b5cf6) border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p.bio {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.5;
            padding: 0 10px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 18px 22px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-white);
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
        }

        .link-text {
            flex-grow: 1;
            text-align: center;
            font-weight: 600;
            font-size: 1.05rem;
        }

        .chevron {
            opacity: 0.4;
            width: 18px;
        }

        .link-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.07);
        }

        /* DESCARGA: Morado */
        .btn-download {
            border-color: rgba(139, 92, 246, 0.4);
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.1), transparent);
        }
        .btn-download i:first-child { color: var(--color-download); filter: drop-shadow(0 0 5px rgba(139, 92, 246, 0.5)); }
        .btn-download:hover { border-color: var(--color-download); box-shadow: 0 0 20px rgba(139, 92, 246, 0.2); }

        /* VIDEO: Rojo/Rosado */
        .btn-video {
            border-color: rgba(244, 63, 94, 0.4);
            background: linear-gradient(90deg, rgba(244, 63, 94, 0.1), transparent);
        }
        .btn-video i:first-child { color: var(--color-video); filter: drop-shadow(0 0 5px rgba(244, 63, 94, 0.5)); }
        .btn-video:hover { border-color: var(--color-video); box-shadow: 0 0 20px rgba(244, 63, 94, 0.2); }

        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #475569;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Perfil / Logo -->
        <div class="profile">
            <!-- 
                El atributo onerror actúa como un salvavidas si la imagen logoAR.png 
                tarda en cargar o no se encuentra, mostrando un fondo con tus iniciales.
            -->
            <img 
                src="logoAR.png" 
                alt="Logo Andy Rodrez" 
                class="logo-img" 
                onerror="this.src='https://placehold.co/120x120/1e293b/f8fafc?text=AR'"
            >
            <h1>Andy Rodrez</h1>
            <p class="bio">Ayudo a emprendedores neurodivergentes a hackear su código fuente y salir del caos.</p>
        </div>

        <!-- Enlaces -->
        <div class="links-container">
            
            <!-- Descarga Documento -->
            <a href="https://andyrodrez.com/" target="_blank" class="link-card btn-download">
                <i data-lucide="download"></i>
                <span class="link-text">Descargar The System Reset</span>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

            <!-- Ver Video -->
            <a href="https://youtube.com/playlist?list=PLQK8QmZYWQTZzQlEWu0Sv__7e4k87D5Tf&si=rJBa2eLV6qI5RkKY" target="_blank" class="link-card btn-video">
                <i data-lucide="play-circle"></i>
                <span class="link-text">Ver Video Explicativo</span>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

        </div>

        <div class="footer">
            <p>© 2026 Andy Rodrez. Hecho para mentes diferentes.</p>
        </div>
    </div>

    <script>
        // Inicializar los iconos de Lucide (hace que las etiquetas <i> se conviertan en SVGs)
        lucide.createIcons();
    </script>
</body>
</html>
