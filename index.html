<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andy Rodrez | Smartlink</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* Paleta base de andyrodrez.com */
            --bg-dark: #0f172a;
            --text-white: #f8fafc;
            
            /* Colores de marca con opacidad para fondos */
            --color-web: #3b82f6;
            --color-whatsapp: #22c55e;
            --color-instagram: #f43f5e;
            
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile {
            margin-bottom: 35px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid transparent;
            background: linear-gradient(var(--bg-dark), var(--bg-dark)) padding-box,
                        linear-gradient(135deg, var(--color-web), #8b5cf6) border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            object-fit: cover;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p.bio {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 18px 22px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-white);
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
        }

        /* WEB: Azul Permanente */
        .btn-web {
            border-color: rgba(59, 130, 246, 0.4);
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.1), transparent);
        }
        .btn-web i:first-child { color: var(--color-web); filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.5)); }

        /* WHATSAPP: Verde Permanente */
        .btn-whatsapp {
            border-color: rgba(34, 197, 94, 0.4);
            background: linear-gradient(90deg, rgba(34, 197, 94, 0.1), transparent);
        }
        .btn-whatsapp i:first-child { color: var(--color-whatsapp); filter: drop-shadow(0 0 5px rgba(34, 197, 94, 0.5)); }

        /* INSTAGRAM: Gradiente Permanente */
        .btn-instagram {
            border-color: rgba(244, 63, 94, 0.4);
            background: linear-gradient(90deg, rgba(244, 63, 94, 0.1), transparent);
        }
        .btn-instagram i:first-child { color: var(--color-instagram); filter: drop-shadow(0 0 5px rgba(244, 63, 94, 0.5)); }

        .link-text {
            flex-grow: 1;
            text-align: center;
            font-weight: 600;
            font-size: 1.05rem;
        }

        /* Hover dinámico mejorado */
        .link-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.07);
        }

        .btn-web:hover { border-color: var(--color-web); box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
        .btn-whatsapp:hover { border-color: var(--color-whatsapp); box-shadow: 0 0 20px rgba(34, 197, 94, 0.2); }
        .btn-instagram:hover { border-color: var(--color-instagram); box-shadow: 0 0 20px rgba(244, 63, 94, 0.2); }

        .chevron {
            opacity: 0.4;
            width: 18px;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #475569;
            font-weight: 500;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Perfil -->
        <div class="profile">
            <img src="https://andyrodrez.com/wp-content/uploads/2023/10/Andy-Rodrez-Avatar.jpg" alt="Andy Rodrez" class="profile-img" onerror="this.src='https://ui-avatars.com/api/?name=Andy+Rodrez&background=3b82f6&color=fff'">
            <h1>Andy Rodrez</h1>
            <p class="bio">Estratega Digital & Ex-Ingeniero.<br>Hago que tu presencia digital sea rentable.</p>
        </div>

        <!-- Enlaces -->
        <div class="links-container">
            
            <!-- Sitio Web -->
            <a href="https://andyrodrez.com/" target="_blank" class="link-card btn-web">
                <i data-lucide="globe"></i>
                <span class="link-text">Visitar Mi Web</span>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

            <!-- WhatsApp -->
            <a href="https://wa.me/56977778989" target="_blank" class="link-card btn-whatsapp">
                <i data-lucide="message-circle"></i>
                <span class="link-text">WhatsApp Directo</span>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/andy.rodrez/" target="_blank" class="link-card btn-instagram">
                <i data-lucide="instagram"></i>
                <span class="link-text">@andy.rodrez</span>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

        </div>

        <div class="footer">
            ESTRATEGIA & DISEÑO © 2026
        </div>
    </div>

    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();
    </script>
</body>
</html>
